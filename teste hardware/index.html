<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitor RFID</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.8.2.7.js"></script>
    <style>
        :root {
            --bg: #eef2f7;
            --panel: #ffffff;
            --text: #162033;
            --muted: #667085;
            --success: #138a36;
            --danger: #c62828;
            --border: #d7deea;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(160deg, #eef2f7 0%, #dfe7f3 100%);
            color: var(--text);
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .hero {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 18px 40px rgba(22, 32, 51, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        p {
            margin: 0;
            color: var(--muted);
        }

        .status {
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: #edf7ee;
            color: var(--success);
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 18px 40px rgba(22, 32, 51, 0.08);
        }

        .card h2 {
            margin: 0 0 16px;
            font-size: 20px;
        }

        .latest {
            min-height: 240px;
        }

        .badge {
            display: inline-flex;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.ok {
            background: #e8f6ec;
            color: var(--success);
        }

        .badge.denied {
            background: #fdecec;
            color: var(--danger);
        }

        .event-row {
            border-top: 1px solid var(--border);
            padding: 14px 0;
        }

        .event-row:first-child {
            border-top: 0;
            padding-top: 0;
        }

        .event-title {
            margin: 0 0 6px;
            font-weight: 700;
        }

        .meta {
            color: var(--muted);
            font-size: 14px;
        }

        .history {
            max-height: 420px;
            overflow: auto;
        }

        @media (max-width: 760px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <h1>Monitor de Acessos RFID</h1>
            <p>Esta tela recebe os eventos publicados pelo `app.py` no PubNub e atualiza em tempo real.</p>
            <div class="status" id="connection-status">Conectando ao canal...</div>
        </section>

        <section class="grid">
            <article class="card latest">
                <h2>Ultima leitura</h2>
                <div id="latest-event" class="meta">Aguardando aproximacao da tag...</div>
            </article>

            <article class="card">
                <h2>Historico em tempo real</h2>
                <div id="history" class="history"></div>
            </article>
        </section>
    </main>

    <script>
        const PUBNUB_SUBSCRIBE_KEY = "sub-c-7830b8bc-9ccc-4f70-b89d-0a22951b20a8";
        const PUBNUB_CHANNEL = "meu_canal";

        const connectionStatus = document.getElementById("connection-status");
        const latestEvent = document.getElementById("latest-event");
        const history = document.getElementById("history");

        const renderBadge = (authorized) => {
            const cssClass = authorized ? "ok" : "denied";
            const label = authorized ? "Autorizado" : "Nao autorizado";
            return `<span class="badge ${cssClass}">${label}</span>`;
        };

        const renderEvent = (event) => `
            <div class="event-row">
                <div class="event-title">${event.nome} - ${event.evento}</div>
                <div>${renderBadge(event.autorizado)}</div>
                <div class="meta">Tag: ${event.tag_id}</div>
                <div class="meta">${event.mensagem}</div>
                <div class="meta">Leitura: ${event.lido_em}</div>
            </div>
        `;

        const updateLatest = (event) => {
            latestEvent.innerHTML = renderEvent(event);
        };

        const prependHistory = (event) => {
            history.insertAdjacentHTML("afterbegin", renderEvent(event));
        };

        const pubnub = new PubNub({
            subscribeKey: PUBNUB_SUBSCRIBE_KEY,
            userId: "rfid-dashboard"
        });

        pubnub.addListener({
            status: function (statusEvent) {
                if (statusEvent.category === "PNConnectedCategory") {
                    connectionStatus.textContent = "Conectado ao canal em tempo real";
                }
            },
            message: function (messageEvent) {
                const event = messageEvent.message.data;
                if (!event) {
                    return;
                }

                updateLatest(event);
                prependHistory(event);
            }
        });

        pubnub.subscribe({ channels: [PUBNUB_CHANNEL] });
    </script>
</body>
</html>
